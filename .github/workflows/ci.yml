name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tes & dokumen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pyflakes

      - name: Pyflakes (modul dashboard & channel helper)
        run: python -m pyflakes web_dashboard.py channel_targets.py dashboard_admin.py dashboard_ai.py dashboard_ui.py dashboard_tema.py dashboard_uji.py dashboard_unggah.py dashboard_pesan.py dashboard_tiket.py dashboard_panel.py

      - name: Dokumen situs sinkron dengan docs/
        run: python tools/sync_docs.py --check

      - name: Tes otomatis
        run: python -m pytest -q
