[project]
name = "ai-discord-chat"
version = "1.2.0b0"
description = "Discord AI Chat, Vision, Image Generator & Community Agent Bot powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "whyuangga" }]
dependencies = [
    "discord.py>=2.5.0,<3.0.0",
    "aiohttp>=3.10.0,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
