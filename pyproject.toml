[project]
name = "ai-discord-chat"
version = "1.40.0b0"
description = "Discord AI Chat, Vision, Image Generator & Community Agent Bot powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "whyuangga" }]
keywords = ["discord", "bot", "gemini", "ai", "dashboard", "community"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "discord.py>=2.5.0,<3.0.0",
    "aiohttp>=3.10.0,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "wavelink>=3.5.0",
    "PyNaCl>=1.5.0",
    "devey>=0.2.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyflakes>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
