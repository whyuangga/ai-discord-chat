baseURL = "/"
locale = "id"
defaultContentLanguage = "id"
title = "AI Discord Chat — Dokumentasi"
theme = "lotusdocs"
enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
# Taksonomi tidak dipakai; tanpa ini Hugo membuat /categories/ dan /tags/ kosong
# yang ikut masuk sitemap.
disableKinds = ["taxonomy", "term"]

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark.renderer]
    unsafe = true

[params]
  # Meta halaman depan; deskripsinya ada di content/_index.md (lihat
  # layouts/partials/head.html). Dipakai juga sebagai cadangan og:description.
  keywords = "AI Discord Chat, bot Discord, dokumentasi bot Discord, Discord bot Bahasa Indonesia, Lavalink, open source"
  author = "AI Discord Chat"

  [params.footer]
    copyright = "Dokumentasi AI Discord Chat & Community Agent — MIT"

  [params.social]
    github = "whyuangga/ai-discord-chat"

  [params.docs]
    title = "Dokumentasi AI Discord Chat"
    themeColor = "magenta"
    darkMode = true
    prism = true
    prismTheme = "lotusdocs"
    editPage = false
    lastMod = false
    sidebarIcons = true
    breadcrumbs = true
    backToTop = true
    toc = true
    tocMobile = true
    scrollSpy = true
    descriptions = true
    titleIcon = true
    navDesc = true

  [params.flexsearch]
    enabled = true
